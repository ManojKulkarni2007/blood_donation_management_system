<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Issue Blood</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Issue Blood</h2>
  <form action="issue.php" method="post">
    <label>Recipient ID:</label>
    <input type="text" name="recipient_id" required><br><br>

    <label>Blood Group:</label>
    <input type="text" name="blood_group" required><br><br>

    <label>Quantity (ml):</label>
    <input type="number" name="quantity" required><br><br>

    <label>Date:</label>
    <input type="date" name="issue_date" required><br><br>

    <button type="submit">Record Issue</button>
  </form>
</body>
</html>
