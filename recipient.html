<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recipient Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2 style="text-align:center;">Recipient Registration</h2>
  <form action="recipients.php" method="post" style="text-align:center;">
    <label>Name:</label>
    <input type="text" name="recipient_name" required><br><br>

    <label>Age:</label>
    <input type="number" name="recipient_age" required><br><br>

    <label>Gender:</label>
    <input type="text" name="recipient_gender"><br><br>

    <label>Blood Group:</label>
    <input type="text" name="recipient_blood_group" required><br><br>

    <label>Contact:</label>
    <input type="text" name="recipient_contact"><br><br>

    <label>Hospital:</label>
    <input type="text" name="recipient_hospital"><br><br>

    <button type="submit">Register</button>
  </form>

  <div style="margin-top:20px; text-align:center;">
    <a href="index.html">Back to Dashboard</a>
  </div>
</body>
</html>
